    <script>
      (function redirectGithubPagesSpa() {
        var params = new URLSearchParams(window.location.search)
        var redirectedPath = params.get('p')

        if (!redirectedPath || !redirectedPath.startsWith('/') || redirectedPath.startsWith('//')) {
          return
        }

        var redirectedQuery = params.get('q')
        var redirectedHash = window.location.hash || ''
        var nextUrl = redirectedPath + (redirectedQuery ? '?' + redirectedQuery : '') + redirectedHash

        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
